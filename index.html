<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Spin, build and understand the 14 Bravais lattices." />
    <title>Unit Cell Explorer</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Light mode unless the user picked dark before (the OS setting is ignored on purpose).
      // Applied before first paint, so there is no flash.
      (function () {
        var t = null;
        try { t = localStorage.getItem('uce-theme'); } catch (e) {}
        document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Unit Cell Explorer needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
